<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程评审 · 星与土</title>
  <meta name="description" content="星与土课程评审与多人打分系统">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="course-common.css">
</head>
<body>
  <!-- Header -->
  <header class="page-header">
    <a href="index.html" class="nav-logo"><span class="nav-logo-mascots"><img src="assets/star-mascot.png" alt="星星"><img src="assets/earth-mascot.png" alt="土土"></span>
      <span class="logo-star">星</span><span class="logo-amp">与</span><span class="logo-earth">土</span>
    </a>
    <div class="nav-links">
      <div class="nav-group">
        <button class="nav-group-trigger">📖 课程开发</button>
        <div class="nav-dropdown">
          <a href="index.html" class="nav-dropdown-item">开发指南</a>
          <a href="course-submit.html" class="nav-dropdown-item">提交课程</a>
          <a href="ai-generator.html" class="nav-dropdown-item">AI 助手</a>
        </div>
      </div>
      <div class="nav-group has-active">
        <button class="nav-group-trigger">📋 评审管理</button>
        <div class="nav-dropdown">
          <a href="topic-review.html" class="nav-dropdown-item">选题评审</a>
          <a href="course-review.html" class="nav-dropdown-item active">课程评审</a>
        </div>
      </div>
      <div class="nav-group">
        <button class="nav-group-trigger">📊 资源中心</button>
        <div class="nav-dropdown">
          <a href="pbl-cases.html" class="nav-dropdown-item">案例库</a>
          <a href="course-map.html" class="nav-dropdown-item">全景图</a>
        </div>
      </div>
      <div class="nav-group">
        <button class="nav-group-trigger">🚀 运营工具</button>
        <div class="nav-dropdown">
          <a href="ai-marketing.html" class="nav-dropdown-item">AI 内容生成</a>
          <a href="ops-dashboard.html" class="nav-dropdown-item">运营看板</a>
        </div>
      </div>
      <div class="nav-group">
        <button class="nav-group-trigger">⚙️ 管理</button>
        <div class="nav-dropdown">
          <a href="admin-dashboard.html" class="nav-dropdown-item">管理后台</a>
        </div>
      </div>
      <div class="nav-user">
        <button class="nav-user-btn" id="nav-user-btn" onclick="window.__switchUser && window.__switchUser()">
          <span class="nav-user-avatar" id="nav-user-avatar">?</span>
          <span id="nav-user-name">未登录</span>
        </button>
      </div>
      <button id="theme-toggle" aria-label="切换主题" style="background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:6px;">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="page-main">
    <h1 class="page-title">📊 课程评审</h1>
    <p class="page-desc">查看已提交的课程方案，进行多维度评分。支持多人对同一课程独立评价。</p>

    <!-- Loading State -->
    <div class="loading-state" id="loading-state">
      <div class="loading-spinner"></div>
      <p>正在加载课程数据...</p>
    </div>

    <div class="course-list" id="course-list">
      <!-- Dynamically rendered -->
    </div>
  </main>

  <div class="identity-modal-overlay" id="identity-modal" style="display:none">
    <div class="identity-modal">
      <div class="identity-modal-icon">🔐</div>
      <h3 id="identity-modal-title">登录 / 注册</h3>
      <p id="identity-modal-desc">请输入姓名和密码</p>
      <input type="text" class="form-input" id="identity-name" placeholder="你的姓名" autocomplete="username" style="margin:12px 0 8px;text-align:center">
      <input type="password" class="form-input" id="identity-password" placeholder="设置密码（首次为注册）" autocomplete="current-password" style="margin:0 0 8px;text-align:center">
      <div style="display:flex;gap:8px">
        <select class="form-select" id="identity-role" style="flex:1">
          <option value="teacher">教师</option>
          <option value="ops">运营</option>
          <option value="admin">管理</option>
        </select>
      </div>
      <div id="admin-key-wrap" style="display:none;margin-top:8px"><input type="password" class="form-input" id="admin-key" placeholder="请输入管理员密钥" style="text-align:center"></div>
      <div id="invite-code-wrap" style="display:none;margin-top:8px"><input type="text" class="form-input" id="invite-code" placeholder="请输入机构邀请码" style="text-align:center"></div>
      <div id="identity-error" style="color:#e17055;font-size:0.8rem;margin-top:8px;min-height:20px"></div>
      <button class="btn-submit" id="identity-confirm" style="margin-top:8px;width:100%" disabled>登录 / 注册</button>
      <p id="identity-hint" style="font-size:0.72rem;color:var(--text-muted);margin-top:10px">首次输入姓名将自动注册，再次登录需输入正确密码</p>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
    <div style="background:var(--surface,#fff);border-radius:16px;padding:32px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
      <div style="font-size:48px;margin-bottom:12px">🗑️</div>
      <h3 style="margin:0 0 8px;color:var(--text,#333)">确定删除？</h3>
      <p id="delete-modal-text" style="color:var(--text-secondary,#666);margin:0 0 24px;font-size:14px">此操作不可撤销</p>
      <div style="display:flex;gap:12px;justify-content:center">
        <button id="delete-modal-cancel" style="padding:10px 24px;border-radius:8px;border:1px solid var(--border,#ddd);background:transparent;color:var(--text,#333);cursor:pointer;font-size:14px">取消</button>
        <button id="delete-modal-confirm" style="padding:10px 24px;border-radius:8px;border:none;background:#ef4444;color:#fff;cursor:pointer;font-size:14px;font-weight:600">确认删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="user-identity.js"></script>
  <script src="course-review.js"></script>
</body>
</html>
